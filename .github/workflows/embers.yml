# Redraws the contribution graph as an ember trail and publishes it to the `output` branch.
name: embers

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/embers-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#ffd8a8,#ffa94d,#f76707,#d9480f
            dist/embers-dark.svg?color_snake=#f0f6fc&color_dots=#161b22,#4a1d0a,#8f3210,#e0561a,#ffb52e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
